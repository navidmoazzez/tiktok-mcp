name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  handshake:
    # A green test suite says the code compiles. This says it speaks MCP,
    # which is the failure a user actually hits.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: List tools over stdio
        env:
          TIKTOK_CLIENT_KEY: ci
          TIKTOK_CLIENT_SECRET: ci
          TIKTOK_REFRESH_TOKEN: ci
        run: node scripts/handshake.mjs
